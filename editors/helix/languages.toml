# Add to ~/.config/helix/languages.toml (or a project's .helix/languages.toml).
# The queries live in runtime/queries/sultanc/ next to this file; copy or
# symlink that directory to ~/.config/helix/runtime/queries/sultanc.

[[language]]
name = "sultanc"
scope = "source.sultanc"
file-types = ["sn"]
roots = ["Supax.toml"]
comment-token = "//"
indent = { tab-width = 4, unit = "    " }
language-servers = ["sultanc-analyzer"]
auto-format = false

[language.auto-pairs]
'(' = ')'
'{' = '}'
'[' = ']'
'"' = '"'
'«' = '»'

[language-server.sultanc-analyzer]
# Installed in the SultanC toolchain (~/.supax/bin, on PATH); it finds its
# standard library next to itself.
command = "sultanc-analyzer"

[[grammar]]
name = "sultanc"
source = { git = "https://github.com/sultan-language/sultanc-language-support", rev = "REPLACE_WITH_COMMIT", subpath = "tree-sitter-sultanc" }
